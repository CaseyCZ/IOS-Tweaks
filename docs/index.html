<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#090d16">
  <meta name="description" content="IOS-Tweaks by CaseyCZ. A new iOS tweak repository, coming soon.">
  <title>IOS-Tweaks by CaseyCZ</title>
  <style>
    :root { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color-scheme: dark; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(ellipse at 50% 0%, #192b48 0, #0d1321 45%, #090d16 100%); color: #f3f7ff; }
    main { max-width: 760px; margin: 0 auto; padding: 100px 24px 72px; }
    .hero { text-align: center; margin-bottom: 72px; }
    .eyebrow { margin: 0 0 20px; color: #a7bad7; font-size: .75rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(3.1rem, 9vw, 5.3rem); letter-spacing: -.075em; line-height: 1; }
    .tagline { margin: 24px 0 10px; font-size: clamp(1.15rem, 3vw, 1.5rem); color: #d6e1f5; }
    .byline, .note, .detail { color: #9caec9; line-height: 1.65; }
    .byline { margin: 0; }
    a { color: #a6d0ff; }
    .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin: 34px 0 15px; }
    .button { display: inline-block; padding: 14px 23px; border: 1px solid #4a607d; border-radius: 12px; text-decoration: none; font-weight: 700; background: #18243a; color: #eaf3ff; }
    .button.primary { background: #4c9aff; border-color: #4c9aff; color: #061221; }
    .button:hover { filter: brightness(1.12); }
    .note { font-size: .86rem; margin: 0; }
    footer { margin-top: 62px; text-align: center; color: #8e9fb8; font-size: .9rem; }
    @media (max-width: 480px) { main { padding-top: 72px; } .hero { margin-bottom: 52px; } .button { width: 100%; } }
  </style>
</head>
<body>
  <main>
    <header class="hero">
      <p class="eyebrow">iOS tweaks by CaseyCZ</p>
      <h1>IOS-Tweaks</h1>
      <p class="tagline">Little tweaks. A more personal iPhone.</p>
      <p class="byline">Created by <a href="https://github.com/CaseyCZ">CaseyCZ</a></p>
      <nav class="actions" aria-label="Repository links">
        <a class="button primary" href="sileo://source/https://caseycz.github.io/IOS-Tweaks/">Add to Sileo</a>
        <a class="button" href="https://caseycz.github.io/IOS-Tweaks/">Repository URL</a>
      </nav>
      <p class="note">Coming soon — packages are not available for installation yet.</p>
    </header>

    <footer>Made with care by CaseyCZ.</footer>
  </main>
</body>
</html>
